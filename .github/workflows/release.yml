name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for a test build (no release is published)
        default: 0.0.0-test

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and !(Test-Path -LiteralPath ".github/releases/$version.md")) {
            throw "Add .github/releases/$version.md with user-facing changes before publishing a release."
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: StarlitSeasonMods-${{ env.VERSION }}
          path: dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-Item dist/*.zip
          $notesPath = ".github/releases/$env:VERSION.md"
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title "StarlitSeasonMods $env:VERSION" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
